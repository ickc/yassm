name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal example
      description: A short, self-contained script reproducing the problem, with its output or traceback.
      render: python
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Your OS, and the output of `pixi list` or `pip list` (at least yassm, numba, numpy and scipy).
      render: text
    validations:
      required: true
