name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# the jobs only read the repository, whatever the default permissions of its token
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # a push to a pull request supersedes its previous run, but the runs on main complete
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          environments: docs
          locked: true
      - run: pixi run -e docs docs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/docs

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
