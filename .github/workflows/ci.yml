name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          environments: lint
          locked: true
      - run: pixi run -e lint lint

  package:
    # the sdist and wheel build, and their metadata (README rendering, classifiers) are valid for PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          environments: build
          locked: true
      - run: pixi run -e build check-dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/pkg/

  test:
    name: test (${{ matrix.os }}, ${{ matrix.environment }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # every platform of the pixi workspace with the default (latest) environment
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-latest, windows-latest]
        environment: [default]
        # every supported Python version on Linux
        include:
          - { os: ubuntu-latest, environment: py311 }
          - { os: ubuntu-latest, environment: py312 }
          - { os: ubuntu-latest, environment: py313 }
          - { os: ubuntu-latest, environment: py314 }
          - { os: ubuntu-latest, environment: py315 }
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          environments: ${{ matrix.environment }}
          locked: true
      - run: pixi run -e ${{ matrix.environment }} test

  test-boundscheck:
    # out-of-bounds accesses in Numba code are silent (or segfault) unless bounds checking is on
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          locked: true
      - run: pixi run test-boundscheck

  examples:
    name: examples (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          locked: true
      - run: pixi run examples
