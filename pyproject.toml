[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "yassm"
dynamic = ["version"]
description = "Yet Another State Space Model package: Kalman filtering/smoothing, particle filters and quasi-Monte Carlo in Numba."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Kolen Cheung", email = "christian.kolen@gmail.com" }]
requires-python = ">=3.11"
keywords = [
    "state space model",
    "time series",
    "Kalman filter",
    "particle filter",
    "sequential Monte Carlo",
    "quasi-Monte Carlo",
    "Hilbert curve",
    "numba",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numba>=0.59",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
# plotting of fits and Hilbert curves
plot = ["matplotlib>=3.6", "seaborn>=0.12"]
# DataFrame/Series helpers and datetime forecasting index
pandas = ["pandas>=2"]
# Hessian at the MLE (normal approximation of the posterior)
hessian = ["numdifftools>=0.9.41"]
all = ["yassm[plot,pandas,hessian]"]

[project.urls]
Homepage = "https://github.com/ickc/yassm"
Documentation = "https://ickc.github.io/yassm"
Repository = "https://github.com/ickc/yassm"
Issues = "https://github.com/ickc/yassm/issues"

[dependency-groups]
test = [
    "yassm[all]",
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-xdist>=3",
    "statsmodels>=0.14",
]
examples = [
    "yassm[all]",
    "jupytext>=1.16",
    "statsmodels>=0.14",
]
docs = [
    { include-group = "examples" },
    "sphinx>=8",
    "furo>=2024.8.6",
    "myst-nb>=1.1",
    "sphinx-copybutton>=0.5",
    "sphinx-autodoc-typehints>=2",
]
lint = [
    "ruff>=0.8",
]
dev = [
    { include-group = "test" },
    { include-group = "docs" },
    { include-group = "lint" },
]

[tool.hatch.version]
path = "src/yassm/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "examples", "LICENSE", "README.md", "CHANGELOG.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/yassm"]

# pytest #######################################################################

[tool.pytest.ini_options]
minversion = "8"
addopts = ["-ra", "--strict-markers", "--strict-config"]
testpaths = ["tests"]
xfail_strict = true
markers = [
    "examples: run the STAT 248 homework scripts in examples/ (slow)",
]
filterwarnings = [
    "error::pytest.PytestReturnNotNoneWarning",
]

# coverage #####################################################################

[tool.coverage.run]
branch = true
source = ["yassm"]

[tool.coverage.paths]
source = ["src", "*/site-packages"]

[tool.coverage.report]
show_missing = true
precision = 2
