[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "yassm"
dynamic = ["version"]
description = "Yet Another State Space Model package: Kalman filtering/smoothing, particle filters and quasi-Monte Carlo in Numba."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Kolen Cheung", email = "christian.kolen@gmail.com" }]
requires-python = ">=3.11"
keywords = [
    "state space model",
    "time series",
    "Kalman filter",
    "particle filter",
    "sequential Monte Carlo",
    "quasi-Monte Carlo",
    "Hilbert curve",
    "numba",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numba>=0.59",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
# plotting of fits and Hilbert curves
plot = ["matplotlib>=3.6", "seaborn>=0.12"]
# DataFrame/Series helpers and datetime forecasting index
pandas = ["pandas>=2"]
# Hessian at the MLE (normal approximation of the posterior)
hessian = ["numdifftools>=0.9.41"]
all = ["yassm[plot,pandas,hessian]"]

[project.urls]
Homepage = "https://github.com/ickc/yassm"
Documentation = "https://ickc.github.io/yassm"
Repository = "https://github.com/ickc/yassm"
Issues = "https://github.com/ickc/yassm/issues"

[dependency-groups]
test = [
    "yassm[all]",
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-xdist>=3",
    "statsmodels>=0.14",
]
examples = [
    "yassm[all]",
    "jupytext>=1.16",
    "statsmodels>=0.14",
]
docs = [
    { include-group = "examples" },
    "sphinx>=8",
    "furo>=2024.8.6",
    "myst-nb>=1.1",
    "sphinx-copybutton>=0.5",
    "sphinx-autodoc-typehints>=2",
]
dev = [
    { include-group = "test" },
    { include-group = "docs" },
]

[tool.hatch.version]
path = "src/yassm/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "examples", "LICENSE", "README.md", "CHANGELOG.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/yassm"]

# pytest #######################################################################

[tool.pytest.ini_options]
minversion = "8"
addopts = ["-ra", "--strict-markers", "--strict-config"]
testpaths = ["tests"]
xfail_strict = true
markers = [
    "examples: run the STAT 248 homework scripts in examples/ (slow)",
]
filterwarnings = [
    "error::pytest.PytestReturnNotNoneWarning",
]

# coverage #####################################################################

[tool.coverage.run]
branch = true
source = ["yassm"]

[tool.coverage.paths]
source = ["src", "*/site-packages"]

[tool.coverage.report]
show_missing = true
precision = 2

# pixi #########################################################################

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]
requires-pixi = ">=0.50"

# Everything comes from conda-forge; only yassm itself is installed (editable) from the source tree.
# The PEP 735 dependency groups and the extras above are for uv / pip users and PyPI metadata.
[tool.pixi.dependencies]
python = ">=3.11"
numba = ">=0.59"
numpy = ">=1.24"
scipy = ">=1.10"
matplotlib-base = ">=3.6"
seaborn-base = ">=0.12"
pandas = ">=2"
numdifftools = ">=0.9.41"

[tool.pixi.pypi-dependencies]
yassm = { path = ".", editable = true }

[tool.pixi.feature.test.dependencies]
pytest = ">=8"
pytest-cov = ">=5"
pytest-xdist = ">=3"
statsmodels = ">=0.14"

[tool.pixi.feature.examples.dependencies]
ipython = "*"
jupytext = ">=1.16"
statsmodels = ">=0.14"

[tool.pixi.feature.docs.dependencies]
sphinx = ">=8"
furo = ">=2024.8.6"
myst-nb = ">=1.1"
sphinx-copybutton = ">=0.5"
sphinx-autodoc-typehints = ">=2"

[tool.pixi.feature.lint.dependencies]
ruff = ">=0.8"

[tool.pixi.feature.py311.dependencies]
python = "3.11.*"
[tool.pixi.feature.py312.dependencies]
python = "3.12.*"
[tool.pixi.feature.py313.dependencies]
python = "3.13.*"
[tool.pixi.feature.py314.dependencies]
python = "3.14.*"
[tool.pixi.feature.py315.dependencies]
python = "3.15.*"

[tool.pixi.feature.test.tasks]
test = { cmd = "pytest -n auto", description = "Run the unit tests" }
test-cov = { cmd = "pytest -n auto --cov --cov-report=term --cov-report=xml", description = "Run the unit tests with coverage" }
test-boundscheck = { cmd = "pytest -n auto", env = { NUMBA_BOUNDSCHECK = "1" }, description = "Run the unit tests with Numba bounds checking enabled" }
examples = { cmd = "pytest -n auto -m examples tests/test_examples.py", env = { MPLBACKEND = "Agg" }, description = "Run every homework script in examples/ as an integration test" }

[tool.pixi.feature.lint.tasks]
lint = { cmd = "ruff check && ruff format --check", description = "Lint and check formatting" }
fmt = { cmd = "ruff check --fix && ruff format", description = "Auto-fix lint and format" }

[tool.pixi.feature.docs.tasks]
docs = { cmd = "sphinx-build -W --keep-going -b dirhtml docs dist/docs", env = { MPLBACKEND = "Agg" }, description = "Build the documentation site into dist/docs" }
docs-serve = { cmd = "python -m http.server -d dist/docs 8000", depends-on = ["docs"], description = "Build and serve the docs locally" }

[tool.pixi.environments]
default = { features = ["test", "examples", "lint"], solve-group = "default" }
docs = { features = ["docs", "examples"], solve-group = "default" }
lint = { features = ["lint"], solve-group = "default" }
py311 = ["py311", "test"]
py312 = ["py312", "test"]
py313 = ["py313", "test"]
py314 = ["py314", "test"]
py315 = ["py315", "test"]

# ruff #########################################################################

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["docs/conf.py"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "NPY", # NumPy-specific rules
    "PT",  # flake8-pytest-style
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",    # line length is handled by the formatter
    "E741",    # ambiguous variable names: single-letter math names follow the literature
    "RUF001",  # Greek letters (σ, Γ, Σ, ...) are intentional
    "RUF002",
    "RUF003",
    "NPY002",  # legacy np.random.* is required inside Numba-jitted functions
    "PT006",   # parametrize names as a comma-separated string is fine
    "PT007",
    "PT009",   # unittest-style assertions in TestCase classes
    "PT027",
    "RUF059",  # unused unpacked variables document shapes, e.g. `N, d = x.shape`
]

[tool.ruff.lint.isort]
known-first-party = ["yassm"]

[tool.ruff.lint.per-file-ignores]
"examples/**" = ["E402", "B018", "F811"]

[tool.ruff.format]
docstring-code-format = true
